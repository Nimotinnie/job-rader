name: daily-jobs
on:
  schedule: [{cron: "30 23 * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python fetch_jobs.py
        env:
          REED_KEY: ${{ secrets.REED_KEY }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add docs/jobs.json && (git diff --cached --quiet || git commit -m "daily update") && git push
